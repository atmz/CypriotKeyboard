<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Play screenshot frame (1080×1920)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px;
    height: 1920px;
    overflow: hidden;
    background: linear-gradient(160deg, #2E3E1A 0%, #3F5024 55%, #2E3E1A 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .headline {
    margin-top: 84px;
    padding: 0 70px;
    font-size: 62px;
    font-weight: 800;
    letter-spacing: -1px;
    line-height: 1.15;
    color: #FFFFFF;
    text-align: center;
  }
  .headline .accent { color: #E89440; }
  .sub {
    margin-top: 26px;
    padding: 0 90px;
    font-size: 32px;
    font-weight: 500;
    line-height: 1.35;
    color: rgba(255, 255, 255, 0.85);
    text-align: center;
  }
  .phone {
    margin-top: 56px;
    width: 700px;
    border-radius: 48px 48px 0 0;
    border: 10px solid #1A2410;
    border-bottom: none;
    box-shadow: 0 -18px 70px rgba(0, 0, 0, 0.45);
    overflow: hidden;
    flex: 1;
  }
  .phone img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
</style>
</head>
<body>
  <div class="headline">Hold a key for <span class="accent">accents</span></div>
  <div class="sub">Long-press any vowel for its accented forms</div>
  <div class="phone"><img src="raw/shot_popup.png" alt=""></div>
</body>
</html>
