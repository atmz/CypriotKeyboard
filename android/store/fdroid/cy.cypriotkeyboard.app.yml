Summary: Cypriot Greek keyboard with Greeklish input and on-device autocorrect
Description: |-
    The first keyboard built specifically for Cypriot Greek — including the
    breve sounds (σ̆, ζ̆, τζ̆) that standard Greek doesn't have.

    Two ways to type:

    * Greek layout: the Cypriot Greek alphabet with breve marks. Long-press
      vowels for accents; the accent key becomes a breve after σ, ζ, ξ, ψ, ς.
    * Greeklish: type Latin letters and watch them become Cypriot Greek.
      "kalimera" becomes καλημέρα, "tziai" becomes τζ̆αι. Tap 🔄 to switch.

    Autocorrect is backed by a 49 MB dictionary of Cypriot Greek words —
    including dialect words (ίντα, λαλώ, εν, μιτά) found in no standard Greek
    dictionary. Final sigma (σ → ς) is automatic.

    Privacy by design: the app has no INTERNET permission — keystrokes cannot
    leave the device. No analytics, no telemetry, no ads.

